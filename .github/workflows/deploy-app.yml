name: Deploy App

# 앱(EAS 빌드 + 스토어 제출)은 웹과 따로, app-release 브랜치에 올렸을 때만 돈다.
# EAS 무료 플랜은 월 빌드 횟수가 적어서 main 머지(웹 배포)마다 빌드하지 않는다.
# 앱 출시: 확인을 마친 main을 그대로 올린다 -> git push origin main:app-release
on:
  push:
    branches: [app-release]
  workflow_dispatch:

jobs:
  build-and-submit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build and submit (iOS & Android)
        run: eas build --platform all --profile production --non-interactive --auto-submit --no-wait
